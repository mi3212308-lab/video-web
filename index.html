<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin">
<title>Video — 검색 기반 추천</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f0f0f;color:#f1f1f1;font:14px Arial,sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit;border:0}header{height:60px;position:sticky;top:0;z-index:5;background:#101010;display:flex;align-items:center;gap:22px;padding:0 22px;border-bottom:1px solid #292929}.brand{font-size:21px;font-weight:700;white-space:nowrap}.logo{display:inline-grid;place-items:center;background:#f03;color:#fff;border-radius:7px;width:30px;height:21px;margin-right:8px;font-size:13px}form{display:flex;max-width:620px;width:55%;margin:auto}input{background:#121212;border:1px solid #383838;color:white;padding:12px 16px;outline:none}form input{flex:1;min-width:0;border-radius:22px 0 0 22px}form button{background:#303030;padding:0 24px;border-radius:0 22px 22px 0}.layout{display:flex}.side{width:205px;position:fixed;top:60px;bottom:0;padding:16px 12px;border-right:1px solid #252525}.nav{display:block;width:100%;text-align:left;background:transparent;padding:13px;border-radius:9px;color:#eee}.nav:hover,.nav.active{background:#292929}.main{margin-left:205px;padding:20px 24px;width:calc(100% - 205px)}.chips{display:flex;gap:9px;overflow:auto;margin-bottom:22px}.chip{background:#292929;border-radius:8px;padding:9px 14px;white-space:nowrap}.chip.active{background:#f1f1f1;color:#111}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:30px 17px}.card{cursor:pointer;min-width:0}.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:11px;background:#292929}.line{display:flex;gap:11px;margin-top:10px}.avatar{width:36px;height:36px;border-radius:50%;background:#343434;display:grid;place-items:center;flex:none}.title{font-weight:600;font-size:15px;line-height:1.4}.muted{color:#aaa;font-size:13px;line-height:1.5;margin-top:5px}.status{color:#aaa;margin:12px 0 18px}.watch{max-width:1180px;margin:auto}.player{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}.player iframe{width:100%;height:100%;border:0}.player-fallback{padding:12px;text-align:center;background:#202020;color:#ddd}.player-fallback a{display:inline-block;background:#eee;color:#111;padding:10px 16px;border-radius:20px;text-decoration:none;margin-top:8px}.watch h2{font-size:20px}.watchgrid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px}.secondary{background:#272727;border-radius:10px;padding:14px;white-space:pre-wrap;color:#ddd}.related .card{display:flex;gap:10px;margin-bottom:15px}.related .thumb{width:145px;flex:none}.related .line{margin:0}.related .avatar{display:none}.hidden{display:none!important}.settings{position:fixed;right:15px;bottom:15px;background:#242424;border:1px solid #444;border-radius:12px;padding:16px;width:min(360px,calc(100vw - 30px));z-index:9;box-shadow:0 8px 30px #0009}.settings input{width:100%;margin:8px 0;border-radius:7px}.settings button,.smallbtn{background:#444;padding:9px 12px;border-radius:7px;margin:4px 5px 0 0}.empty{padding:32px;text-align:center;color:#aaa}.hint{color:#aaa;font-size:12px;line-height:1.6}.notice{border:1px solid #393939;background:#191919;padding:12px;border-radius:9px;margin:12px 0 18px}.channel-btn{display:inline-block;background:transparent;color:#aaa;padding:3px 0;text-align:left;font-size:13px}.channel-btn:hover{color:#fff;text-decoration:underline}.channel-head{display:flex;align-items:center;gap:14px;margin:10px 0 22px;padding:18px;background:#202020;border-radius:12px}.shorts-shell{height:calc(100vh - 112px);min-height:520px;display:flex;justify-content:center;align-items:center;gap:18px}.shorts-stage{height:100%;max-height:850px;aspect-ratio:9/16;width:auto;max-width:min(100%,480px);background:#000;border-radius:16px;overflow:hidden;position:relative}.shorts-stage iframe{width:100%;height:100%;border:0}.shorts-controls{display:flex;flex-direction:column;gap:10px}.shorts-controls button{background:#292929;border:1px solid #444;border-radius:50%;width:44px;height:44px;font-size:20px}.shorts-caption{position:absolute;left:14px;right:14px;bottom:14px;padding:42px 10px 10px;background:linear-gradient(transparent,#000b);pointer-events:none}.shorts-caption b{display:block;font-size:15px;line-height:1.4}.shorts-caption span{color:#ddd;font-size:12px}.history-tools{display:flex;gap:8px;align-items:center;margin:12px 0 20px;flex-wrap:wrap}.history-tools button{background:#303030;padding:9px 12px;border-radius:8px}.channel-avatar{width:64px;height:64px;border-radius:50%;background:#393939;display:grid;place-items:center;font-size:25px}.channel-head h2{margin:0 0 6px}.pill{display:inline-block;background:#333;border-radius:20px;padding:4px 9px;font-size:12px;margin-left:6px}
@media(max-width:850px){.side{width:70px}.nav{font-size:0;text-align:center}.nav:before{content:"•";font-size:18px}.main{margin-left:70px;width:calc(100% - 70px)}.watchgrid{grid-template-columns:1fr}}@media(max-width:600px){header{padding:0 10px;gap:10px}.brand{font-size:17px}form{width:auto;flex:1}.side{display:none}.main{margin:0;width:100%;padding:14px}.grid{grid-template-columns:1fr}.related .thumb{width:120px}}
</style>
</head>
<body>
<header><div class="brand"><span class="logo">▶</span>Video</div><form id="searchForm"><input id="searchInput" placeholder="검색어를 입력하세요"><button>검색</button></form></header>
<div class="layout"><aside class="side"><button class="nav active" data-view="home">홈</button><button class="nav" data-view="popular">한국 인기 영상</button><button class="nav" data-view="shorts">쇼츠</button><button class="nav" data-view="recommend">맞춤 추천</button><button class="nav" data-view="history">시청 기록</button><hr style="border-color:#292929;margin:14px 0"><button class="nav" id="settingsBtn">API 키 설정</button><p class="hint">로그인 없이 공개 영상만 검색합니다.</p></aside>
<main class="main"><section id="browse"><div class="chips"><button class="chip active" data-topic="all">전체</button><button class="chip" data-topic="게임">게임</button><button class="chip" data-topic="음악">음악</button><button class="chip" data-topic="과학">과학</button><button class="chip" data-topic="기술">기술</button><button class="chip" data-topic="스포츠">스포츠</button><button class="chip" data-topic="뉴스">뉴스</button></div><div id="channelHeader"></div><div id="status" class="status">API 키를 설정하면 로그인 없이 영상을 검색하고 추천 목록을 볼 수 있습니다.</div><div id="results" class="grid"></div></section>
<section id="watch" class="watch hidden"><button class="smallbtn" id="back">← 목록으로</button><div class="watchgrid"><div><div class="player" id="player"></div><h2 id="wtitle"></h2><div id="wmeta" class="muted"></div><div id="wdesc" class="secondary"></div></div><aside><h3>이 영상과 비슷한 추천</h3><div id="related" class="related"></div></aside></div></section>
<section id="shortsView" class="hidden"><button class="smallbtn" id="shortsBack">← 목록으로</button><div class="shorts-shell">
<div class="shorts-stage" id="shortsStage"><div class="empty">쇼츠를 불러오는 중입니다.</div></div>
<div class="shorts-controls"><button id="shortPrev" title="이전 영상">↑</button><button id="shortNext" title="다음 영상">↓</button></div>
</div><p class="hint" style="text-align:center">마우스 휠 또는 키보드 ↑ ↓, 모바일에서는 위아래로 넘겨보세요.</p></section>
<section id="historyView" class="hidden"><h2>시청 기록</h2><div class="history-tools"><span id="historySummary" class="muted"></span><button id="clearHistory">기록 전체 삭제</button></div><div id="historyResults" class="grid"></div></section>
</main></div>
<div id="settings" class="settings hidden"><b>YouTube Data API 키 설정</b><p class="hint">Google Cloud에서 YouTube Data API v3를 사용 설정한 뒤 API 키를 발급해 입력합니다. Google 계정 로그인은 필요하지 않습니다. API 키는 이 브라우저에만 저장됩니다.</p><input id="apiKey" placeholder="YouTube Data API 키"><button id="saveKey">저장</button><button id="closeSettings">닫기</button></div>
<script>
const $=s=>document.querySelector(s);
let apiKey=localStorage.getItem('ytPublicApiKey')||'',activeView='home',lastItems=[],lastQuery='',shortItems=[],shortIndex=0,watchStarted=0,watchTimer=null,currentVideo=null;
$('#apiKey').value=apiKey;
const HISTORY_KEY='videoWatchHistoryV1';
const readHistory=()=>{try{return JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]')}catch{return []}};
const saveHistory=x=>localStorage.setItem(HISTORY_KEY,JSON.stringify(x.slice(0,200)));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function status(s){$('#status').textContent=s}
function videoId(v){return typeof v.id==='string'?v.id:(v.id?.videoId||v.contentDetails?.videoId||v.videoId||'')}
function cleanWords(s){return String(s||'').toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,' ').split(/\s+/).filter(w=>w.length>1)}
function historyScore(v){
 const h=readHistory(); if(!h.length)return 0;
 const sn=v.snippet||{}, candidate=new Set(cleanWords((sn.title||'')+' '+(sn.channelTitle||'')+' '+(sn.description||'')));
 let score=0;
 h.forEach((item,i)=>{
   const recency=Math.max(.25,1-i/Math.max(10,h.length));
   const weight=(1+Math.min(4,(item.watchSeconds||0)/45))*recency;
   cleanWords((item.title||'')+' '+(item.channel||'')+' '+(item.tags||'')).forEach(w=>{if(candidate.has(w))score+=weight});
   if(item.channel&&item.channel===sn.channelTitle)score+=weight*3;
 });
 return score;
}
function personalize(items){
 const h=readHistory(); if(!h.length)return items;
 return [...items].sort((a,b)=>historyScore(b)-historyScore(a));
}
function card(v){const sn=v.snippet||{},id=videoId(v),t=sn.thumbnails||{},img=t.medium?.url||t.high?.url||t.default?.url||`https://i.ytimg.com/vi/${encodeURIComponent(id)}/hqdefault.jpg`,channelId=sn.channelId||'';
 return `<article class="card" data-id="${esc(id)}"><img class="thumb" loading="lazy" src="${esc(img)}"><div class="line"><div class="avatar">▶</div><div><div class="title">${esc(sn.title||'제목 없음')}</div><button class="channel-btn" data-channel="${esc(channelId)}" data-name="${esc(sn.channelTitle||'채널')}">${esc(sn.channelTitle||'채널 정보 없음')}</button><div class="muted">${esc(sn.publishedAt?new Date(sn.publishedAt).toLocaleDateString('ko-KR'):'')}</div></div></div></article>`;
}
function render(items,target='#results'){
 const el=$(target);el.innerHTML=items.map(card).join('')||'<div class="empty">표시할 영상이 없습니다.</div>';
 el.querySelectorAll('.card').forEach(x=>x.onclick=()=>openVideo(x.dataset.id));
 el.querySelectorAll('.channel-btn').forEach(b=>b.onclick=e=>{e.stopPropagation();if(b.dataset.channel)openChannel(b.dataset.channel,b.dataset.name)});
}
async function yt(path){
 if(!apiKey){$('#settings').classList.remove('hidden');throw Error('API 키를 먼저 설정해 주세요.')}
 const sep=path.includes('?')?'&':'?';const r=await fetch('https://www.googleapis.com/youtube/v3/'+path+sep+'key='+encodeURIComponent(apiKey));const d=await r.json();
 if(!r.ok)throw Error(d.error?.message||'YouTube API 요청 실패');return d;
}
function hideSections(){
 ['browse','watch','shortsView','historyView'].forEach(id=>$('#'+id).classList.add('hidden'));
}
function showBrowse(){hideSections();$('#browse').classList.remove('hidden')}
function beginWatchTracking(){watchStarted=Date.now();clearInterval(watchTimer);watchTimer=setInterval(()=>updateWatchTime(false),5000)}
function updateWatchTime(finalize){
 if(!currentVideo||!watchStarted)return;
 const seconds=Math.max(0,Math.floor((Date.now()-watchStarted)/1000));
 const h=readHistory();const found=h.find(x=>x.id===currentVideo.id);
 if(found){found.watchSeconds=(found.watchSeconds||0)+seconds;found.watchedAt=Date.now();found.title=currentVideo.title;found.channel=currentVideo.channel;found.tags=currentVideo.tags||found.tags}
 else h.unshift({...currentVideo,watchSeconds:seconds,watchedAt:Date.now()});
 saveHistory(h);watchStarted=Date.now();
 if(finalize){clearInterval(watchTimer);watchTimer=null}
}
function rememberVideo(v){
 const sn=v.snippet||{};currentVideo={id:videoId(v)||v.id,title:sn.title||v.title||'제목 없음',channel:sn.channelTitle||v.channel||'',tags:(sn.tags||[]).join(' ')};
 beginWatchTracking();
}
async function search(q){
 if(!q.trim())return;lastQuery=q;activeView='home';showBrowse();$('#channelHeader').innerHTML='';status(`“${q}” 관련 영상을 찾는 중입니다.`);
 try{const d=await yt('search?part=snippet&type=video&maxResults=24&order=relevance&q='+encodeURIComponent(q));lastItems=personalize(d.items||[]);render(lastItems);status(`“${q}” 검색 결과 ${lastItems.length}개 · 시청 기록 반영`);document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x.dataset.topic===q))}
 catch(e){status(e.message)}
}
async function popular(){
 activeView='popular';showBrowse();$('#channelHeader').innerHTML='';document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view==='popular'));status('한국 인기 영상을 불러오는 중입니다.');
 try{const d=await yt('videos?part=snippet,statistics&chart=mostPopular&regionCode=KR&maxResults=24');lastItems=personalize((d.items||[]).map(v=>({id:v.id,snippet:v.snippet})));render(lastItems);status(readHistory().length?'한국 인기 영상 · 시청 기록 기반으로 순서 조정됨':'한국 인기 영상')}
 catch(e){status(e.message)}
}
async function shorts(){
 activeView='shorts';hideSections();$('#shortsView').classList.remove('hidden');document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view==='shorts'));$('#shortsStage').innerHTML='<div class="empty">쇼츠를 불러오는 중입니다.</div>';status('짧은 영상들을 불러오는 중입니다.');
 try{
  const d=await yt('search?part=snippet&type=video&videoDuration=short&maxResults=30&order=relevance&q=%23shorts');
  shortItems=personalize(d.items||[]);shortIndex=0;showShortAt(0);status('쇼츠 · 휠, 방향키 또는 스와이프로 넘겨보세요.');
 }catch(e){$('#shortsStage').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}
}
function showShortAt(index){
 if(!shortItems.length)return;shortIndex=(index+shortItems.length)%shortItems.length;
 const v=shortItems[shortIndex],id=videoId(v),sn=v.snippet||{};
 if(currentVideo&&watchStarted)updateWatchTime(true);
 rememberVideo(v);
 $('#shortsStage').innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&mute=0&controls=1&rel=0&playsinline=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="쇼츠 영상"></iframe><div class="shorts-caption"><b>${esc(sn.title||'')}</b><span>${esc(sn.channelTitle||'')}</span></div>`;
}
function moveShort(delta){showShortAt(shortIndex+delta)}
async function openChannel(channelId,name){
 activeView='channel';showBrowse();document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));
 $('#channelHeader').innerHTML=`<div class="channel-head"><div class="channel-avatar">▶</div><div><h2>${esc(name)} <span class="pill">채널</span></h2><div class="muted">이 채널의 공개 동영상</div></div></div>`;
 status(`${name} 채널의 영상을 불러오는 중입니다.`);
 try{const d=await yt('search?part=snippet&channelId='+encodeURIComponent(channelId)+'&type=video&order=date&maxResults=24');lastItems=personalize(d.items||[]);render(lastItems);status(`${name} 채널의 공개 영상 ${lastItems.length}개`)}
 catch(e){status(e.message)}
}
async function openVideo(id){
 if(currentVideo&&watchStarted)updateWatchTime(true);
 hideSections();$('#watch').classList.remove('hidden');
 const watchUrl='https://www.youtube.com/watch?v='+encodeURIComponent(id);
 $('#player').innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0&enablejsapi=1" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; encrypted-media; picture-in-picture; web-share" allowfullscreen title="영상 플레이어"></iframe><div class="player-fallback">영상이 재생되지 않나요?<br><a href="${watchUrl}" target="_blank" rel="noopener noreferrer">YouTube에서 영상 보기</a></div>`;
 $('#wtitle').textContent='영상 정보를 불러오는 중입니다.';$('#wmeta').textContent='';$('#wdesc').textContent='';$('#related').innerHTML='';
 try{
  const d=await yt('videos?part=snippet,statistics&id='+encodeURIComponent(id));const v=d.items?.[0];
  if(!v){$('#wtitle').textContent='영상 정보를 찾을 수 없습니다.';return}
  rememberVideo({id,snippet:v.snippet});$('#wtitle').textContent=v.snippet.title;
  $('#wmeta').innerHTML=`${esc(v.snippet.channelTitle)} · 조회수 ${Number(v.statistics.viewCount||0).toLocaleString('ko-KR')}<br><button class="channel-btn" id="watchChannel">이 채널의 다른 영상 보기</button>`;
  $('#watchChannel').onclick=()=>openChannel(v.snippet.channelId,v.snippet.channelTitle);$('#wdesc').textContent=v.snippet.description||'';
  const words=(v.snippet.title+' '+(v.snippet.tags||[]).join(' ')).replace(/[\[\](){}|]/g,' ').split(/\s+/).filter(x=>x.length>1).slice(0,5);const q=words.join(' ')||v.snippet.channelTitle;
  const rec=await yt('search?part=snippet&type=video&maxResults=8&order=relevance&q='+encodeURIComponent(q));render(personalize((rec.items||[]).filter(x=>videoId(x)!==id)),'#related');
 }catch(e){$('#related').innerHTML='<div class="hint">관련 영상을 불러오지 못했습니다.</div>';if(!$('#wtitle').textContent||$('#wtitle').textContent.includes('불러오는'))$('#wtitle').textContent='영상 정보 조회에 실패했습니다.'}
}
function showHistory(){
 activeView='history';hideSections();$('#historyView').classList.remove('hidden');document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view==='history'));
 const h=readHistory();$('#historySummary').textContent=`최근 시청한 영상 ${h.length}개 · 이 브라우저에 저장됨`;
 const el=$('#historyResults');el.innerHTML=h.map(v=>`<article class="card" data-id="${esc(v.id)}"><img class="thumb" loading="lazy" src="https://i.ytimg.com/vi/${encodeURIComponent(v.id)}/hqdefault.jpg"><div class="line"><div><div class="title">${esc(v.title)}</div><div class="muted">${esc(v.channel)} · 시청 누적 ${Math.floor((v.watchSeconds||0)/60)}분</div></div></div></article>`).join('')||'<div class="empty">아직 시청 기록이 없습니다.</div>';
 el.querySelectorAll('.card').forEach(x=>x.onclick=()=>openVideo(x.dataset.id));
}
async function recommendations(){
 activeView='recommend';showBrowse();$('#channelHeader').innerHTML='';document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view==='recommend'));
 status('시청 기록을 바탕으로 맞춤 영상을 구성하고 있습니다.');
 try{
  const h=readHistory();if(!h.length){status('아직 시청 기록이 없습니다. 영상을 몇 개 시청하면 맞춤 추천이 시작됩니다.');lastItems=[];render([]);return}
  const terms=[...new Set(h.flatMap(x=>cleanWords((x.title||'')+' '+(x.tags||''))))].slice(0,8);
  const q=terms.join(' ')||h[0].channel;const d=await yt('search?part=snippet&type=video&maxResults=30&order=relevance&q='+encodeURIComponent(q));
  const seen=new Set(h.map(x=>x.id));lastItems=personalize((d.items||[]).filter(v=>!seen.has(videoId(v))));render(lastItems);
  status(`시청 기록 ${h.length}개에서 관심 단어를 분석한 맞춤 추천 ${lastItems.length}개`);
 }catch(e){status(e.message)}
}
$('#searchForm').onsubmit=e=>{e.preventDefault();search($('#searchInput').value)};
document.querySelectorAll('.chip').forEach(x=>x.onclick=()=>{const q=x.dataset.topic;if(q==='all')popular();else search(q)});
document.querySelectorAll('[data-view]').forEach(x=>x.onclick=()=>x.dataset.view==='popular'?popular():x.dataset.view==='shorts'?shorts():x.dataset.view==='history'?showHistory():x.dataset.view==='recommend'?recommendations():(activeView='home',popular()));
$('#back').onclick=()=>{if(currentVideo&&watchStarted)updateWatchTime(true);showBrowse()};
$('#shortsBack').onclick=()=>showBrowse();
$('#shortPrev').onclick=()=>moveShort(-1);$('#shortNext').onclick=()=>moveShort(1);
$('#shortsStage').addEventListener('wheel',e=>{if(activeView==='shorts'){e.preventDefault();moveShort(e.deltaY>0?1:-1)}},{passive:false});
let touchY=0;$('#shortsStage').addEventListener('touchstart',e=>{touchY=e.touches[0].clientY},{passive:true});
$('#shortsStage').addEventListener('touchend',e=>{const dy=touchY-e.changedTouches[0].clientY;if(Math.abs(dy)>45)moveShort(dy>0?1:-1)},{passive:true});
document.addEventListener('keydown',e=>{if(activeView==='shorts'&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();moveShort(e.key==='ArrowDown'?1:-1)}});
$('#clearHistory').onclick=()=>{if(confirm('시청 기록을 모두 삭제할까요?')){localStorage.removeItem(HISTORY_KEY);showHistory()}};
$('#settingsBtn').onclick=()=>$('#settings').classList.toggle('hidden');$('#closeSettings').onclick=()=>$('#settings').classList.add('hidden');
$('#saveKey').onclick=()=>{apiKey=$('#apiKey').value.trim();localStorage.setItem('ytPublicApiKey',apiKey);$('#settings').classList.add('hidden');popular()};
window.addEventListener('beforeunload',()=>{if(currentVideo&&watchStarted)updateWatchTime(true)});
if(apiKey)popular();else status('API 키 설정을 열어 YouTube Data API 키를 입력해 주세요. 로그인은 필요하지 않습니다.');
</script></body></html>
