<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin">
<title>Video — 검색 기반 추천</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f0f0f;color:#f1f1f1;font:14px Arial,sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit;border:0}header{height:60px;position:sticky;top:0;z-index:5;background:#101010;display:flex;align-items:center;gap:22px;padding:0 22px;border-bottom:1px solid #292929}.brand{font-size:21px;font-weight:700;white-space:nowrap}.logo{display:inline-grid;place-items:center;background:#f03;color:#fff;border-radius:7px;width:30px;height:21px;margin-right:8px;font-size:13px}form{display:flex;max-width:620px;width:55%;margin:auto}input{background:#121212;border:1px solid #383838;color:white;padding:12px 16px;outline:none}form input{flex:1;min-width:0;border-radius:22px 0 0 22px}form button{background:#303030;padding:0 24px;border-radius:0 22px 22px 0}.layout{display:flex}.side{width:205px;position:fixed;top:60px;bottom:0;padding:16px 12px;border-right:1px solid #252525}.nav{display:block;width:100%;text-align:left;background:transparent;padding:13px;border-radius:9px;color:#eee}.nav:hover,.nav.active{background:#292929}.main{margin-left:205px;padding:20px 24px;width:calc(100% - 205px)}.chips{display:flex;gap:9px;overflow:auto;margin-bottom:22px}.chip{background:#292929;border-radius:8px;padding:9px 14px;white-space:nowrap}.chip.active{background:#f1f1f1;color:#111}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:30px 17px}.card{cursor:pointer;min-width:0}.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:11px;background:#292929}.line{display:flex;gap:11px;margin-top:10px}.avatar{width:36px;height:36px;border-radius:50%;background:#343434;display:grid;place-items:center;flex:none}.title{font-weight:600;font-size:15px;line-height:1.4}.muted{color:#aaa;font-size:13px;line-height:1.5;margin-top:5px}.status{color:#aaa;margin:12px 0 18px}.watch{max-width:1180px;margin:auto}.player{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}.player iframe{width:100%;height:100%;border:0}.player-fallback{padding:12px;text-align:center;background:#202020;color:#ddd}.player-fallback a{display:inline-block;background:#eee;color:#111;padding:10px 16px;border-radius:20px;text-decoration:none;margin-top:8px}.watch h2{font-size:20px}.watchgrid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px}.secondary{background:#272727;border-radius:10px;padding:14px;white-space:pre-wrap;color:#ddd}.related .card{display:flex;gap:10px;margin-bottom:15px}.related .thumb{width:145px;flex:none}.related .line{margin:0}.related .avatar{display:none}.hidden{display:none!important}.settings{position:fixed;right:15px;bottom:15px;background:#242424;border:1px solid #444;border-radius:12px;padding:16px;width:min(360px,calc(100vw - 30px));z-index:9;box-shadow:0 8px 30px #0009}.settings input{width:100%;margin:8px 0;border-radius:7px}.settings button,.smallbtn{background:#444;padding:9px 12px;border-radius:7px;margin:4px 5px 0 0}.empty{padding:32px;text-align:center;color:#aaa}.hint{color:#aaa;font-size:12px;line-height:1.6}.notice{border:1px solid #393939;background:#191919;padding:12px;border-radius:9px;margin:12px 0 18px}
@media(max-width:850px){.side{width:70px}.nav{font-size:0;text-align:center}.nav:before{content:"•";font-size:18px}.main{margin-left:70px;width:calc(100% - 70px)}.watchgrid{grid-template-columns:1fr}}@media(max-width:600px){header{padding:0 10px;gap:10px}.brand{font-size:17px}form{width:auto;flex:1}.side{display:none}.main{margin:0;width:100%;padding:14px}.grid{grid-template-columns:1fr}.related .thumb{width:120px}}
</style>
</head>
<body>
<header><div class="brand"><span class="logo">▶</span>Video</div><form id="searchForm"><input id="searchInput" placeholder="검색어를 입력하세요"><button>검색</button></form></header>
<div class="layout"><aside class="side"><button class="nav active" data-view="home">홈</button><button class="nav" data-view="popular">한국 인기 영상</button><hr style="border-color:#292929;margin:14px 0"><button class="nav" id="settingsBtn">API 키 설정</button><p class="hint">로그인 없이 공개 영상만 검색합니다.</p></aside>
<main class="main"><section id="browse"><div class="chips"><button class="chip active" data-topic="all">전체</button><button class="chip" data-topic="게임">게임</button><button class="chip" data-topic="음악">음악</button><button class="chip" data-topic="과학">과학</button><button class="chip" data-topic="기술">기술</button><button class="chip" data-topic="스포츠">스포츠</button><button class="chip" data-topic="뉴스">뉴스</button></div><div id="status" class="status">API 키를 설정하면 로그인 없이 영상을 검색하고 추천 목록을 볼 수 있습니다.</div><div id="results" class="grid"></div></section>
<section id="watch" class="watch hidden"><button class="smallbtn" id="back">← 목록으로</button><div class="watchgrid"><div><div class="player" id="player"></div><h2 id="wtitle"></h2><div id="wmeta" class="muted"></div><div id="wdesc" class="secondary"></div></div><aside><h3>이 영상과 비슷한 추천</h3><div id="related" class="related"></div></aside></div></section></main></div>
<div id="settings" class="settings hidden"><b>YouTube Data API 키 설정</b><p class="hint">Google Cloud에서 YouTube Data API v3를 사용 설정한 뒤 API 키를 발급해 입력합니다. Google 계정 로그인은 필요하지 않습니다. API 키는 이 브라우저에만 저장됩니다.</p><input id="apiKey" placeholder="YouTube Data API 키"><button id="saveKey">저장</button><button id="closeSettings">닫기</button></div>
<script>
const $=s=>document.querySelector(s);let apiKey=localStorage.getItem('ytPublicApiKey')||'',activeView='home',lastItems=[],lastQuery='';$('#apiKey').value=apiKey;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function status(s){$('#status').textContent=s}
function videoId(v){return typeof v.id==='string'?v.id:(v.id?.videoId||v.contentDetails?.videoId||v.videoId||'')}
function card(v){const sn=v.snippet||{},id=videoId(v),t=sn.thumbnails||{},img=t.medium?.url||t.high?.url||t.default?.url||`https://i.ytimg.com/vi/${encodeURIComponent(id)}/hqdefault.jpg`;return `<article class="card" data-id="${esc(id)}"><img class="thumb" loading="lazy" src="${esc(img)}"><div class="line"><div class="avatar">▶</div><div><div class="title">${esc(sn.title||'제목 없음')}</div><div class="muted">${esc(sn.channelTitle||'')}<br>${esc(sn.publishedAt?new Date(sn.publishedAt).toLocaleDateString('ko-KR'):'')}</div></div></div></article>`}
function render(items,target='#results'){const el=$(target);el.innerHTML=items.map(card).join('')||'<div class="empty">표시할 영상이 없습니다.</div>';el.querySelectorAll('.card').forEach(x=>x.onclick=()=>openVideo(x.dataset.id))}
async function yt(path){if(!apiKey){$('#settings').classList.remove('hidden');throw Error('API 키를 먼저 설정해 주세요.')}const sep=path.includes('?')?'&':'?';const r=await fetch('https://www.googleapis.com/youtube/v3/'+path+sep+'key='+encodeURIComponent(apiKey));const d=await r.json();if(!r.ok)throw Error(d.error?.message||'YouTube API 요청 실패');return d}
async function search(q,mode='search'){if(!q.trim())return;lastQuery=q;$('#watch').classList.add('hidden');$('#browse').classList.remove('hidden');status(`“${q}” 관련 영상을 찾는 중입니다.`);try{const d=await yt('search?part=snippet&type=video&maxResults=24&order=relevance&q='+encodeURIComponent(q));lastItems=d.items||[];render(lastItems);status(`“${q}” 검색 결과 ${lastItems.length}개 · 관련도순`);document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x.dataset.topic===q))}catch(e){status(e.message)}}
async function popular(){activeView='popular';document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view==='popular'));status('한국 인기 영상을 불러오는 중입니다.');try{const d=await yt('videos?part=snippet,statistics&chart=mostPopular&regionCode=KR&maxResults=24');lastItems=(d.items||[]).map(v=>({id:v.id,snippet:v.snippet}));render(lastItems);status('한국 인기 영상')}catch(e){status(e.message)}}
async function openVideo(id){$('#browse').classList.add('hidden');$('#watch').classList.remove('hidden');const watchUrl='https://www.youtube.com/watch?v='+encodeURIComponent(id);$('#player').innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; encrypted-media; picture-in-picture; web-share" allowfullscreen title="영상 플레이어"></iframe><div class="player-fallback">영상이 재생되지 않나요?<br><a href="${watchUrl}" target="_blank" rel="noopener noreferrer">YouTube에서 영상 보기</a></div>`;$('#wtitle').textContent='영상 정보를 불러오는 중입니다.';$('#wmeta').textContent='';$('#wdesc').textContent='';$('#related').innerHTML='';try{const d=await yt('videos?part=snippet,statistics&id='+encodeURIComponent(id));const v=d.items?.[0];if(!v){$('#wtitle').textContent='영상 정보를 찾을 수 없습니다.';return}$('#wtitle').textContent=v.snippet.title;$('#wmeta').textContent=v.snippet.channelTitle+' · 조회수 '+Number(v.statistics.viewCount||0).toLocaleString('ko-KR');$('#wdesc').textContent=v.snippet.description||'';const words=(v.snippet.title+' '+(v.snippet.tags||[]).join(' ')).replace(/[\[\](){}|]/g,' ').split(/\s+/).filter(x=>x.length>1).slice(0,5);const q=words.join(' ')||v.snippet.channelTitle;const rec=await yt('search?part=snippet&type=video&maxResults=8&order=relevance&q='+encodeURIComponent(q));render((rec.items||[]).filter(x=>videoId(x)!==id),'#related')}catch(e){$('#related').innerHTML='<div class="hint">관련 영상을 불러오지 못했습니다.</div>';if(!$('#wtitle').textContent||$('#wtitle').textContent.includes('불러오는'))$('#wtitle').textContent='영상 정보 조회에 실패했습니다.'}}
$('#searchForm').onsubmit=e=>{e.preventDefault();search($('#searchInput').value)};document.querySelectorAll('.chip').forEach(x=>x.onclick=()=>{const q=x.dataset.topic;if(q==='all'){popular()}else search(q)});document.querySelectorAll('[data-view]').forEach(x=>x.onclick=()=>x.dataset.view==='popular'?popular():(activeView='home',popular()));$('#back').onclick=()=>{$('#watch').classList.add('hidden');$('#browse').classList.remove('hidden')};$('#settingsBtn').onclick=()=>$('#settings').classList.toggle('hidden');$('#closeSettings').onclick=()=>$('#settings').classList.add('hidden');$('#saveKey').onclick=()=>{apiKey=$('#apiKey').value.trim();localStorage.setItem('ytPublicApiKey',apiKey);$('#settings').classList.add('hidden');popular()};
if(apiKey)popular();else status('API 키 설정을 열어 YouTube Data API 키를 입력해 주세요. 로그인은 필요하지 않습니다.');
</script></body></html>
